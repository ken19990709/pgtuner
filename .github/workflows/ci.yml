name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # ubuntu-24.04, not ubuntu-latest: the 26.04 runner image no longer
    # provisions CPython 3.9 via setup-python (EOL), and the 3.9 leg of the
    # matrix is part of the public "Python 3.9+" promise. Revisit if 3.9
    # support is ever dropped.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable with extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[db,dev]"
      - name: Test suite (offline — no PostgreSQL required)
        run: python -m pytest tests/ -q
      - name: Packaging build gate (wheel builds and installs)
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          pgtuner --version
